name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Core integration tests
        run: |
          mkdir -p test-build
          javac -encoding UTF-8 -source 8 -target 8 -d test-build core/src/main/java/lan/classic/*.java tests/CoreTest.java
          java -cp test-build CoreTest
      - name: Build APK and servers; check API calls
        run: gradle --no-daemon :android:assembleDebug :android:lintDebug :server:distZip :server:distTar
      - name: Enforce actual APK minSdk and signature
        run: |
          APK=android/build/outputs/apk/debug/android-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > apk-badging.txt
          grep -qx "sdkVersion:'16'" apk-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --min-sdk-version 16 "$APK"
          mkdir -p dist
          cp "$APK" dist/roblox-classic-android.apk
          cp server/build/distributions/server.zip dist/roblox-classic-server-windows.zip
          gzip -c server/build/distributions/server.tar > dist/roblox-classic-server-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: roblox-classic-android.apk
          path: dist/roblox-classic-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: roblox-classic-server-windows.zip
          path: dist/roblox-classic-server-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: roblox-classic-server-linux.tar.gz
          path: dist/roblox-classic-server-linux.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            apk-badging.txt
            android/build/reports/lint-results-debug.*
